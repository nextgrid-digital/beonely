# Sync LinkedIn-import jobs from the latest scrape output into Supabase.
# Secrets (same Supabase project as Vercel Production):
# SUPABASE_SERVICE_ROLE_KEY, SUPABASE_URL (= VITE_SUPABASE_URL value), optional INGEST_RECRUITER_ID
name: Ingest jobs

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/linkedin-jobs.json'
      - 'scripts/scrape-linkedin-jobs.ts'
      - 'scripts/lib/scrape-linkedin-jobs.ts'
      - 'scripts/ingest-jobs.ts'
      - 'scripts/lib/ingest-linkedin-jobs.ts'
      - '.github/workflows/ingest-jobs.yml'

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install
      - name: Run daily scrape + ingest + stale cleanup
        run: |
          set -euo pipefail
          export SCRAPE_LINKEDIN_SUMMARY_FILE="$RUNNER_TEMP/scrape-summary.json"
          export INGEST_SUMMARY_FILE="$RUNNER_TEMP/ingest-summary.json"
          export JOBS_SYNC_SUMMARY_FILE="$RUNNER_TEMP/jobs-sync-summary.json"
          pnpm sync:jobs 2>&1 | tee jobs-sync.log
          node -e '
            const fs = require("node:fs");
            const summaryPath = process.env.JOBS_SYNC_SUMMARY_FILE;
            if (!summaryPath || !fs.existsSync(summaryPath)) {
              console.error("JOBS sync summary file not found");
              process.exit(1);
            }
            const summary = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
            const envPath = process.env.GITHUB_ENV;
            fs.appendFileSync(envPath, `SYNC_STATUS=${summary.status ?? "FAILED"}\n`);
            fs.appendFileSync(envPath, `SCRAPED_COUNT=${summary.scrape?.jobsWritten ?? 0}\n`);
            fs.appendFileSync(envPath, `SCRAPE_FILTERED=${summary.scrape?.filteredOut ?? 0}\n`);
            fs.appendFileSync(envPath, `SCRAPE_DEDUPED=${summary.scrape?.deduped ?? 0}\n`);
            fs.appendFileSync(envPath, `SCRAPE_FAILED=${summary.scrape?.failed ?? 0}\n`);
            fs.appendFileSync(envPath, `INGEST_INSERTED=${summary.ingest?.inserted ?? 0}\n`);
            fs.appendFileSync(envPath, `INGEST_UPDATED=${summary.ingest?.updated ?? 0}\n`);
            fs.appendFileSync(envPath, `INGEST_SKIPPED=${summary.ingest?.skipped ?? 0}\n`);
            fs.appendFileSync(envPath, `INGEST_FAILED=${summary.ingest?.failed ?? 0}\n`);
            fs.appendFileSync(envPath, `STALE_CANDIDATES=${summary.stale?.candidates ?? 0}\n`);
            fs.appendFileSync(envPath, `STALE_EXPIRED=${summary.stale?.expired ?? 0}\n`);
            fs.appendFileSync(envPath, `STALE_SKIPPED=${summary.stale?.skipped ?? 0}\n`);
            fs.appendFileSync(envPath, `STALE_UPDATE_ERRORS=${summary.stale?.updateErrors ?? 0}\n`);
            fs.appendFileSync(envPath, `STALE_AGED_OUT=${summary.stale?.agedOut ?? 0}\n`);
            fs.appendFileSync(envPath, `STALE_DEAD_LINKS=${summary.stale?.deadLinks ?? 0}\n`);
            const errorCount = Array.isArray(summary.errors) ? summary.errors.length : 0;
            fs.appendFileSync(envPath, `SYNC_ERROR_COUNT=${errorCount}\n`);
          '
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INGEST_RECRUITER_ID: ${{ secrets.INGEST_RECRUITER_ID }}
      - name: Publish scrape + ingest summary
        if: always()
        run: |
          {
            echo "## LinkedIn daily sync summary"
            echo "- Status: ${SYNC_STATUS:-FAILED}"
            echo "- Scraped valid jobs: ${SCRAPED_COUNT:-0}"
            echo "- Scrape filtered out: ${SCRAPE_FILTERED:-0}"
            echo "- Scrape deduped: ${SCRAPE_DEDUPED:-0}"
            echo "- Scrape failed requests: ${SCRAPE_FAILED:-0}"
            echo "- Ingest inserted: ${INGEST_INSERTED:-0}"
            echo "- Ingest updated: ${INGEST_UPDATED:-0}"
            echo "- Ingest skipped duplicates: ${INGEST_SKIPPED:-0}"
            echo "- Ingest failed: ${INGEST_FAILED:-0}"
            echo "- Missing imported jobs: ${STALE_CANDIDATES:-0}"
            echo "- Stale expired (removed from feed): ${STALE_EXPIRED:-0}"
            echo "- Expired older than 1 month: ${STALE_AGED_OUT:-0}"
            echo "- Expired dead/closed apply links: ${STALE_DEAD_LINKS:-0}"
            echo "- Stale cleanup skipped: ${STALE_SKIPPED:-0}"
            echo "- Stale update errors: ${STALE_UPDATE_ERRORS:-0}"
            echo "- Sync errors: ${SYNC_ERROR_COUNT:-0}"
          } >> "$GITHUB_STEP_SUMMARY"
