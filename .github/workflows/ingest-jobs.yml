# Sync LinkedIn-import jobs from data/linkedin-jobs.json (or scraper output) into Supabase.
# Secrets (same Supabase project as Vercel Production):
# SUPABASE_SERVICE_ROLE_KEY, SUPABASE_URL (= VITE_SUPABASE_URL value), optional INGEST_RECRUITER_ID
name: Ingest jobs

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/linkedin-jobs.json'
      - 'scripts/ingest-jobs.ts'
      - 'scripts/lib/ingest-linkedin-jobs.ts'

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install
      - name: Ingest LinkedIn jobs into Supabase
        run: pnpm ingest:jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INGEST_RECRUITER_ID: ${{ secrets.INGEST_RECRUITER_ID }}
